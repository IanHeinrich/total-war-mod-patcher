[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-mod-patcher"
version = "0.5.0"
description = "Extract, compare, and repack Total War mod pack files"
requires-python = ">=3.10"
dependencies = [
    "websockets>=10.0",
    "click>=8.0",
    "rich>=13.0",
    "PyQt6>=6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
tw-patcher = "tw_patcher.cli:cli"

[project.gui-scripts]
tw-patcher-gui = "tw_patcher.ui.app:launch_ui"

[tool.setuptools.packages.find]
include = ["tw_patcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tw-patcher.spec"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
